name: Barbersoftly Landing

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the tested commit or roll back to the previous release
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: landing-ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Exercise deployment and rollback on temporary sites
        run: python3 -m unittest discover -s scripts -p 'test_deploy_landing.py' -v
      - name: Package the tested build
        run: |
          node scripts/prepare-release.mjs dist "$GITHUB_SHA"
          mkdir release
          tar -czf release/site.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-${{ github.sha }}
          path: release/site.tar.gz
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: landing-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: landing-${{ github.sha }}
          path: release
      - name: Publish and verify the origin revision
        run: bash scripts/ci-deploy.sh deploy
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST || '185.133.249.57' }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'omar' }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: landing-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore and verify the previous release
        run: bash scripts/ci-deploy.sh rollback
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST || '185.133.249.57' }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'omar' }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
